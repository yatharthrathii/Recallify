name: CI

on:
  push:
    # v2 became main in phase 7; v1 lives on in the v1-legacy branch.
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  quality:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.12.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @recallify/api db:generate
      # Zero warnings. v1 shipped a failing lint for months because nothing
      # checked it -- see docs/05-ENGINEERING.md.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Budgets on what ships: the engine the phone will also run, and the
      # web app's client JavaScript as a whole. See .size-limit.json.
      - run: pnpm size

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.12.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/* only. The API's tests are integration tests against a real
      # database, and this job has none -- running them here fails on a missing
      # connection rather than on anything being wrong. They run in the job
      # below, which has Postgres.
      #
      # packages/fsrs is pinned at 100% coverage by its own vitest config, so
      # this job fails if the algorithm loses a single covered line.
      - run: pnpm test:packages
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recallify
          POSTGRES_PASSWORD: recallify
          POSTGRES_DB: recallify_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://recallify:recallify@localhost:5432/recallify_test?schema=public
      # No pooler in front of the CI database, so the direct URL is the same one.
      DIRECT_URL: postgresql://recallify:recallify@localhost:5432/recallify_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.12.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The db scripts load the root .env through dotenv-cli, because Prisma
      # looks beside the schema or in cwd and in a monorepo the real one lives
      # at the root. Writing it here means CI runs the identical command a
      # developer runs, rather than a second code path that can rot unnoticed.
      # The integration tests boot the real application, so this file has to
      # satisfy the same env schema the server does -- not just the database
      # URLs the migration scripts need. A missing secret fails validation at
      # boot, which is exactly what it is meant to do.
      - name: Write .env for the db scripts and the app under test
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          echo "DIRECT_URL=$DIRECT_URL" >> .env
          echo "NODE_ENV=test" >> .env
          echo "LOG_LEVEL=error" >> .env
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> .env
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> .env

      - run: pnpm --filter @recallify/api db:deploy

      # The API imports @recallify/contracts and @recallify/fsrs from their
      # compiled dist/, so without this the test run cannot even resolve them.
      # Turbo builds exactly the API's dependencies, not the web app.
      - run: pnpm turbo build --filter=@recallify/api^...
      - run: pnpm --filter @recallify/api db:generate

      - run: pnpm --filter @recallify/api test

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recallify
          POSTGRES_PASSWORD: recallify
          POSTGRES_DB: recallify_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://recallify:recallify@localhost:5432/recallify_e2e?schema=public
      DIRECT_URL: postgresql://recallify:recallify@localhost:5432/recallify_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.12.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # NODE_ENV=test keeps email in memory: the forgot password flow runs
      # end to end without a mail provider and without sending anything.
      - name: Write .env for the API under test
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          echo "DIRECT_URL=$DIRECT_URL" >> .env
          echo "NODE_ENV=test" >> .env
          echo "LOG_LEVEL=error" >> .env
          echo "WEB_URL=http://localhost:3000" >> .env
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> .env
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> .env

      - run: pnpm --filter @recallify/api db:generate
      - run: pnpm --filter @recallify/api db:deploy
      # The production builds, because the service worker only exists there.
      - run: pnpm build
      - run: pnpm --filter @recallify/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.12.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@recallify/web...
      # Public pages only: they need no API or database. Accessibility, best
      # practices and SEO below 0.95 fail the job; performance only warns,
      # because a shared runner's timing is not a measurement of the site.
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14
