name: CI

on:
  push:
    # v2 is the active development branch until it becomes default in phase 7.
    # main still holds v1.
    branches: [main, v2]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.12.0'

jobs:
  quality:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.12.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @recallify/api db:generate
      # Zero warnings. v1 shipped a failing lint for months because nothing
      # checked it -- see docs/05-ENGINEERING.md.
      - run: pnpm lint -- --max-warnings=0
      - run: pnpm typecheck
      - run: pnpm build

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.12.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/fsrs is pinned at 100% coverage by its own vitest config.
      # This job fails if the algorithm loses a single covered line.
      - run: pnpm test
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recallify
          POSTGRES_PASSWORD: recallify
          POSTGRES_DB: recallify_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://recallify:recallify@localhost:5432/recallify_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.12.0' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @recallify/api db:deploy
      - run: pnpm --filter @recallify/api test
